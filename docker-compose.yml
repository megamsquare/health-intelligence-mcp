services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthintel
      POSTGRES_USER: healthintel
      POSTGRES_PASSWORD: healthintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://healthintel:healthintel@db:5432/healthintel?sslmode=disable
      PUBMED_API_KEY: ${PUBMED_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
