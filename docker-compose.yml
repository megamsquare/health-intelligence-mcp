services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: healthintel
      POSTGRES_USER: healthintel
      POSTGRES_PASSWORD: healthintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: production
    env_file:
      - .env
    environment:
      # Overrides DATABASE_URL from .env with the local db service
      DATABASE_URL: postgresql://healthintel:healthintel@db:5432/healthintel?sslmode=disable
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
